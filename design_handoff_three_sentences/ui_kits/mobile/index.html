<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three Sentences — Mobile UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060608">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #060608;
    color: #ebe7dc;
    font-family: 'Schibsted Grotesk', Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #root { width: 100vw; height: 100vh; }
  textarea { outline: none; border: 0; resize: none; }
  input { outline: none; border: 0; }
  button { font-family: inherit; }
  textarea::placeholder, input::placeholder { color: #36363a; }
  .pt-scroll { scrollbar-width: thin; scrollbar-color: #1e1e22 transparent; }
  .pt-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .pt-scroll::-webkit-scrollbar-thumb { background: #1e1e22; border-radius: 4px; }
  *:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
<div data-screen-label="Three Sentences — Mobile prototype"></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Order matters: shell exports tokens + primitives + provider that the others depend on -->
<script type="text/babel" src="proto-shell.jsx"></script>
<script type="text/babel" src="proto-auth.jsx"></script>
<script type="text/babel" src="proto-today.jsx"></script>
<script type="text/babel" src="proto-history.jsx"></script>
<script type="text/babel" src="proto-insights.jsx"></script>
<script type="text/babel" src="proto-social.jsx"></script>
<script type="text/babel" src="proto-account.jsx"></script>
<script type="text/babel" src="proto-app.jsx"></script>
</body>
</html>
