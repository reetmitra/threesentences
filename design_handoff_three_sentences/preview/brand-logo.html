<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Logo mark</title>
<link rel="stylesheet" href="_base.css">
<style>body { min-height: 280px; } .card { padding: 24px; }</style>
</head><body><div class="card">
<div class="label" style="margin-bottom:18px;">Three dots in a rounded tile. White on ink (default), reversed, and mono-dots for inline lockups.</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:center;">
  <div style="background:#0e0e10;border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center;border:1px solid #1e1e22;">
    <img src="../assets/logo/primary.svg" alt="Primary mark on dark" width="96" height="96"/>
  </div>
  <div style="background:#efece5;border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center;">
    <img src="../assets/logo/reversed.svg" alt="Reversed mark on cream" width="96" height="96"/>
  </div>
  <div style="background:#0e0e10;border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center;border:1px solid #1e1e22;">
    <img src="../assets/logo/mono-dots.svg" alt="Mono dots — no tile" height="40"/>
  </div>
  <div style="background:#0e0e10;border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center;border:1px solid #1e1e22;">
    <img src="../assets/logo/app-icon.svg" alt="App icon variant" width="96" height="96"/>
  </div>
</div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#75726a;letter-spacing:1.2px;text-transform:uppercase;margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
  <span>logo/primary.svg</span>
  <span>logo/reversed.svg</span>
  <span>logo/mono-dots.svg</span>
  <span>logo/app-icon.svg</span>
</div>
</div></body></html>
