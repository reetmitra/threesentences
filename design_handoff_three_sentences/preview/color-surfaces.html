<!doctype html>
<html><head><meta charset="utf-8"><title>Surfaces</title>
<link rel="stylesheet" href="_base.css">
<style>body{min-height:240px;}</style>
</head><body><div class="card">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
  
    <div style="background:#000000;border:1px solid #2A2A2A;border-radius:12px;padding:14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span class="label">--bg</span>
      <div>
        <div style="font-family:var(--font-mono);font-size:13px;color:#fff;">#000000</div>
        <div style="font-size:11px;color:#A0A0A0;margin-top:2px;">True black</div>
      </div>
    </div>
    <div style="background:#121212;border:1px solid #2A2A2A;border-radius:12px;padding:14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span class="label">--surface</span>
      <div>
        <div style="font-family:var(--font-mono);font-size:13px;color:#fff;">#121212</div>
        <div style="font-size:11px;color:#A0A0A0;margin-top:2px;">Cards / inputs</div>
      </div>
    </div>
    <div style="background:#1E1E1E;border:1px solid #2A2A2A;border-radius:12px;padding:14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span class="label">--surface-hover</span>
      <div>
        <div style="font-family:var(--font-mono);font-size:13px;color:#fff;">#1E1E1E</div>
        <div style="font-size:11px;color:#A0A0A0;margin-top:2px;">Hover state</div>
      </div>
    </div>
    <div style="background:#2A2A2A;border:1px solid #2A2A2A;border-radius:12px;padding:14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span class="label">--border</span>
      <div>
        <div style="font-family:var(--font-mono);font-size:13px;color:#fff;">#2A2A2A</div>
        <div style="font-size:11px;color:#A0A0A0;margin-top:2px;">Hairlines</div>
      </div>
    </div>
</div></div></body></html>
