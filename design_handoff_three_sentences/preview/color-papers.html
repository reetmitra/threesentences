<!doctype html>
<html><head><meta charset="utf-8"><title>Papers & frame</title>
<link rel="stylesheet" href="_base.css">
<style>body { min-height: 220px; }</style>
</head><body><div class="card">
<div class="label" style="margin-bottom:16px;">Warm near-black, never pure black. Elevation is paper → surface, never shadow.</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
  
    <div style="background:#060608;border:1px solid #1e1e22;border-radius:12px;padding:16px 14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#75726a;">--paper-bg</span>
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#ebe7dc;">#060608</div>
        <div style="font-size:11px;line-height:1.4;margin-top:4px;color:#75726a;">Outer canvas</div>
      </div>
    </div>
    <div style="background:#0e0e10;border:1px solid #1e1e22;border-radius:12px;padding:16px 14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#75726a;">--paper</span>
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#ebe7dc;">#0e0e10</div>
        <div style="font-size:11px;line-height:1.4;margin-top:4px;color:#75726a;">App interior</div>
      </div>
    </div>
    <div style="background:#15151a;border:1px solid #1e1e22;border-radius:12px;padding:16px 14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#75726a;">--surface</span>
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#ebe7dc;">#15151a</div>
        <div style="font-size:11px;line-height:1.4;margin-top:4px;color:#75726a;">Cards, inputs</div>
      </div>
    </div>
    <div style="background:#1e1e22;border:1px solid #1e1e22;border-radius:12px;padding:16px 14px;height:140px;display:flex;flex-direction:column;justify-content:space-between;">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#75726a;">--frame</span>
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#ebe7dc;">#1e1e22</div>
        <div style="font-size:11px;line-height:1.4;margin-top:4px;color:#75726a;">All hairline borders</div>
      </div>
    </div>
</div></div></body></html>
