<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>body{min-height:240px;}</style>
</head><body><div class="card">
<div class="label" style="margin-bottom:14px;">Primary · Outline · Ghost · 48px min</div>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
  <button style="background:#FFFFFF;color:#000;font-family:var(--font-sans);font-size:16px;font-weight:600;border:0;padding:0 28px;height:48px;border-radius:12px;letter-spacing:0.02em;cursor:pointer;">Get early access</button>
  <button style="background:transparent;color:#fff;font-family:var(--font-sans);font-size:14px;font-weight:500;border:1px solid rgba(255,255,255,0.20);padding:0 18px;height:40px;border-radius:8px;cursor:pointer;">Join the waitlist</button>
  <button style="background:transparent;color:rgba(255,255,255,0.6);font-family:var(--font-sans);font-size:14px;font-weight:500;border:0;padding:0 16px;height:40px;border-radius:8px;cursor:pointer;">Cancel</button>
  <button style="background:#2A2A2A;color:#666;font-family:var(--font-sans);font-size:16px;font-weight:600;border:0;padding:0 28px;height:48px;border-radius:12px;cursor:not-allowed;opacity:0.5;">Done</button>
</div>
</div></body></html>
