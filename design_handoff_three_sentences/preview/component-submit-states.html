<!doctype html>
<html><head><meta charset="utf-8"><title>Animated submit button</title>
<link rel="stylesheet" href="_base.css">
<style>body{min-height:280px;}</style>
</head><body><div class="card">
<div class="label" style="margin-bottom:18px;">"Done" → spinner → checkmark · the brand's signature commit</div>
<div style="display:flex;align-items:center;gap:36px;">
  <div style="text-align:center;">
    <div style="width:280px;height:56px;background:#333333;border-radius:28px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;">Done</div>
    <div style="font-size:11px;color:#A0A0A0;margin-top:10px;text-transform:uppercase;letter-spacing:0.2em;">Idle · full-width pill</div>
  </div>
  <div style="text-align:center;">
    <div style="width:56px;height:56px;background:#333333;border-radius:50%;display:flex;align-items:center;justify-content:center;">
      <div style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
    </div>
    <div style="font-size:11px;color:#A0A0A0;margin-top:10px;text-transform:uppercase;letter-spacing:0.2em;">Submitting</div>
  </div>
  <div style="text-align:center;">
    <div style="width:56px;height:56px;background:#333333;border-radius:50%;display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div style="font-size:11px;color:#A0A0A0;margin-top:10px;text-transform:uppercase;letter-spacing:0.2em;">Success</div>
  </div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</div></body></html>
