<!doctype html>
<html><head><meta charset="utf-8"><title>Text Hierarchy</title>
<link rel="stylesheet" href="_base.css">
<style>body{min-height:220px;}</style>
</head><body><div class="card">
<div style="background:#000;border:1px solid #2A2A2A;border-radius:12px;padding:24px;">
  <div style="color:#FFFFFF;font-size:24px;font-weight:600;">Primary text — pure white</div>
  <div style="color:#A0A0A0;font-size:18px;margin-top:8px;">Secondary text — captions, labels</div>
  <div style="color:#666666;font-size:16px;margin-top:8px;">Tertiary text — placeholders, disabled</div>
  <div style="color:#2A2A2A;font-size:14px;margin-top:8px;">Watermarks &amp; ghosting (#2A2A2A)</div>
  <div style="display:flex;gap:24px;margin-top:18px;font-family:var(--font-mono);font-size:11px;color:#666;">
    <span>#FFFFFF</span><span>#A0A0A0</span><span>#666666</span><span>#2A2A2A</span>
  </div>
